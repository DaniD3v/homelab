services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
    restart: unless-stopped

    environment:
      APP_URL: https://auth.danidev.vip
      TRUST_PROXY: "true"
      ENCRYPTION_KEY:
      STATIC_API_KEY:

    volumes:
      - data:/app/data
    networks:
      - proxy

volumes:
  data:

networks:
  proxy:
    external: true
