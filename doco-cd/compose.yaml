services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.131.0@sha256:33761af0adb58696bf7892604a4a319cee6164aa5cb17e5b4b4f5c8cb248a603
    restart: unless-stopped

    environment:
      SELF_UPDATE_ENABLED: "true"
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      POLL_CONFIG: "- {url: https://github.com/DaniD3v/homelab.git, interval: 60}"

    secrets:
      - sops_age_key
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - data:/data

volumes:
  data:

secrets:
  sops_age_key:
    file: /etc/doco-cd/age.key
