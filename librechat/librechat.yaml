version: 1.3.19

interface:
  prompts:
    use: false
  schedules:
    use: true
    create: true

endpoints:
  custom:
    - name: CLIProxyAPI
      apiKey: none
      baseURL: http://cliproxyapi:8317/v1
      models:
        default: [gpt-6.1-sol]
        fetch: true
      addParams:
        web_search: true

# temporary: keep stored credentials readable by the previous image until the upgrade is accepted
credentials:
  writeFormat: legacy
