services:
  api:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8@sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    restart: unless-stopped

    depends_on:
      - mongodb
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      # Without Redis the scheduler stays off unless we assert there is only one api process.
      SCHEDULES_SINGLE_PROCESS: "true"
      CREDS_KEY:
      CREDS_IV:
      JWT_SECRET:
      JWT_REFRESH_SECRET:

    volumes:
      - uploads:/app/uploads
      - images:/app/client/public/images
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3080/health]
    networks:
      - default
      - proxy

  mongodb:
    image: docker.io/library/mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    restart: unless-stopped

    volumes:
      - mongodb:/data/db

volumes:
  mongodb:
  uploads:
  images:

networks:
  proxy:
    external: true
