services:
  api:
    # fork with native scheduling tools
    image: ghcr.io/danid3v-slop/librechat-dev:fe7f8456f543b976389eb23bc56b4bf03577ff70@sha256:2ad348b509c7064adc0566c31f2f7884f0af368499a84ac2b88cb38d3178dc25
    restart: unless-stopped

    depends_on:
      - mongodb
      - cliproxyapi
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      # Without Redis the scheduler stays off unless we assert there is only one api process.
      SCHEDULES_SINGLE_PROCESS: "true"
      DOMAIN_CLIENT: https://clanker.danidev.vip
      DOMAIN_SERVER: https://clanker.danidev.vip
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"
      OPENID_ISSUER: https://auth.danidev.vip
      OPENID_CLIENT_ID: librechat
      OPENID_USE_PKCE: "true"
      OPENID_SCOPE: openid profile email groups offline_access
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_AUTO_REDIRECT: "true"
      OPENID_REUSE_TOKENS: "true"
      OPENID_ADMIN_ROLE: librechat-admin
      OPENID_ADMIN_ROLE_PARAMETER_PATH: groups
      OPENID_ADMIN_ROLE_TOKEN_KIND: id
      CREDS_KEY:
      CREDS_IV:
      JWT_SECRET:
      JWT_REFRESH_SECRET:
      OPENID_SESSION_SECRET:

    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - uploads:/app/uploads
      - images:/app/client/public/images
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3080/health]
    networks:
      - default
      - proxy

  mongodb:
    image: docker.io/library/mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    restart: unless-stopped

    volumes:
      - mongodb:/data/db

  cliproxyapi:
    image: docker.io/eceasy/cli-proxy-api:v8.0.53@sha256:19eae277664c18d980701cf1a283b11440f82efbac17e910a9120fdd5ac0e792
    restart: unless-stopped

    volumes:
      - ./cliproxyapi.yaml:/CLIProxyAPI/config.yaml:ro
      - cliproxyapi:/root/.cli-proxy-api

volumes:
  mongodb:
  uploads:
  images:
  cliproxyapi:

networks:
  proxy:
    external: true
