services:
  caddy:
    image: docker.io/library/caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped

    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/data
    networks:
      - proxy

volumes:
  data:

networks:
  proxy:
    name: proxy
