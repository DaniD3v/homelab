services:
  caddy:
    image: docker.io/library/caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped

    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/data
    networks:
      - proxy

  netbird:
    image: docker.io/netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
    restart: unless-stopped

    network_mode: service:caddy
    cap_add:
      - NET_ADMIN
    environment:
      NB_MANAGEMENT_URL: https://vpn.danidev.vip
      NB_HOSTNAME: homelab
      NB_SETUP_KEY:
    volumes:
      - netbird:/var/lib/netbird

volumes:
  data:
  netbird:

networks:
  proxy:
    name: proxy
