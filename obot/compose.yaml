services:
  docker:
    image: docker.io/library/docker:29.10.0-dind-rootless@sha256:5a703ad0d72cd5e4fb4beca8024d6eddef6d22a46ed1d9812bf3d24ff43ccbce
    restart: unless-stopped

    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun
    volumes:
      - docker:/home/rootless/.local/share/docker
      - docker-socket:/run/user

  obot:
    # fork with a configurable MCP Docker host, a generic OIDC auth provider and no sales prompts
    image: ghcr.io/danid3v-slop/obot:sha-0e021800056c7968a3cdbb0eb1b5cf0947623468@sha256:8213556c9add6fd3fd9611526b3a8dbcbca1d4745c4378ee72adb4532809d1b8
    restart: unless-stopped

    depends_on:
      - docker
    environment:
      DOCKER_HOST: unix:///run/docker/1000/docker.sock
      OBOT_SERVER_HOSTNAME: https://mcp.danidev.vip
      OBOT_SERVER_ENABLE_AUTHENTICATION: "true"
      OBOT_SERVER_MCPDOCKER_HOST: docker
      OBOT_SERVER_MCPDOCKER_PUBLISH_ADDRESS: 0.0.0.0
      OBOT_SERVER_PRODUCT_ANALYTICS_MODE: "off"
      OBOT_SERVER_DISABLE_UPDATE_CHECK: "true"
      OBOT_SERVER_LLM_GATEWAY_MODEL_DATA_URL: "off"
      POSTGRES_PASSWORD:
    volumes:
      - data:/data
      - docker-socket:/run/docker
    networks:
      - default
      - proxy

volumes:
  data:
  docker:
  docker-socket:

networks:
  proxy:
    external: true
